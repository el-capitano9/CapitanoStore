<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capitano Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      min-height: 100vh;
      background: #0a0e1a;
      display: flex;
      justify-content: center;
      padding: 20px;
      transition: background 0.6s ease;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 48px;
      padding: 30px 25px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      height: fit-content;
      margin-top: 20px;
    }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 {
      font-size: 2.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fbbf24, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
    .header .sub {
      color: #94a3b8;
      border-bottom: 1px dashed #2d3748;
      padding-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header .sub a {
      color: #60a5fa;
      text-decoration: none;
      background: rgba(59,130,246,0.1);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.9rem;
      transition: 0.3s;
      border: 1px solid #334155;
    }
    .header .sub a:hover { background: #2563eb; color: white; border-color: #2563eb; }

    /* Tabs Games */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }
    .tab-btn {
      background: rgba(30, 41, 59, 0.5);
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 14px 5px;
      text-align: center;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .tab-btn .icon { font-size: 28px; }
    .tab-btn:hover { transform: translateY(-3px); border-color: #60a5fa; background: rgba(59,130,246,0.05); }
    .tab-btn.active {
      border-color: var(--accent, #fbbf24);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      box-shadow: 0 0 30px rgba(var(--accent-rgb, 251, 191, 36), 0.15);
      transform: scale(1.02);
    }

    /* Game Panel */
    .game-panel {
      display: none;
      animation: fadeSlide 0.5s ease;
    }
    .game-panel.active { display: block; }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .panel-title {
      color: white;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-title span { font-size: 30px; }

    .packs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }
    .pack-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      color: #e2e8f0;
      font-weight: 600;
      backdrop-filter: blur(5px);
    }
    .pack-card:hover { border-color: var(--accent, #fbbf24); transform: scale(1.03); }
    .pack-card.active {
      border-color: var(--accent, #fbbf24);
      background: rgba(var(--accent-rgb, 251, 191, 36), 0.15);
      color: white;
      box-shadow: 0 0 20px rgba(var(--accent-rgb, 251, 191, 36), 0.1);
    }
    .pack-card .price-tag {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 5px;
    }

    .form-group {
      margin: 18px 0;
    }
    .form-group label {
      display: block;
      color: #e2e8f0;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 15px 18px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
      border-radius: 16px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--accent, #3b82f6);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb, 59,130,246), 0.2);
    }
    .form-group textarea { min-height: 60px; resize: vertical; }

    .warning-box {
      background: rgba(239, 68, 68, 0.08);
      border-right: 4px solid #ef4444;
      padding: 12px 16px;
      border-radius: 12px;
      color: #fca5a5;
      font-size: 0.9rem;
      margin: 15px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bank-note {
      background: rgba(251, 191, 36, 0.05);
      border: 1px solid #fbbf24;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      margin: 15px 0;
    }
    .bank-note p { color: #fcd34d; font-size: 1.2rem; font-weight: 700; }
    .bank-note small { color: #d97706; }

    .upload-area {
      border: 2px dashed #475569;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      color: #94a3b8;
      cursor: pointer;
      transition: 0.3s;
      margin: 15px 0;
    }
    .upload-area:hover { border-color: var(--accent, #3b82f6); background: rgba(var(--accent-rgb, 59,130,246), 0.02); }
    #file-name { color: var(--accent, #60a5fa); font-weight: 600; }
    #screenshot-preview { max-width: 100%; max-height: 200px; margin-top: 12px; border-radius: 12px; display: none; }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: var(--accent, #2563eb);
      border: none;
      border-radius: 20px;
      font-size: 1.3rem;
      font-weight: 800;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
      box-shadow: 0 10px 30px rgba(var(--accent-rgb, 37, 99, 235), 0.3);
    }
    .submit-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    #response-msg { margin-top: 20px; text-align: center; font-weight: 600; padding: 12px; border-radius: 14px; display: none; }

    .bot-link-btn {
      display: inline-block;
      margin-top: 20px;
      background: #1e293b;
      padding: 12px 25px;
      border-radius: 40px;
      color: #94a3b8;
      text-decoration: none;
      border: 1px solid #334155;
      transition: 0.3s;
      width: 100%;
      text-align: center;
      font-weight: 600;
    }
    .bot-link-btn:hover { background: #2d3748; color: white; border-color: #60a5fa; }

    @media (max-width: 500px) {
      .tabs { grid-template-columns: repeat(2, 1fr); }
      .packs-grid { grid-template-columns: 1fr 1fr; }
      .container { padding: 20px 15px; }
    }
  </style>
</head>
<body>
<div class="container" id="appContainer">
  <div class="header">
    <h1>🏴‍☠️ CAPITANO</h1>
    <div class="sub">
      <span>متجر الشحن الأسرع</span>
      <a href="https://t.me/CapitanoUserBot" target="_blank">🤖 تواصل عبر البوت</a>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="gameTabs"></div>

  <form id="orderForm" enctype="multipart/form-data">
    <div id="panelsContainer"></div>

    <div class="warning-box"><span>⚠️</span><div><strong>تحذير:</strong> ارفع الصورة قبل التأكيد، وتأكد من ظهور المبلغ والرقم.</div></div>
    <div class="bank-note"><p>💳 حول المبلغ على رقم: <span style="color:#fde047;">01036732010</span></p><small>فودافون كاش</small></div>

    <div class="upload-area" id="uploadArea"><div>📤 اضغط لرفع الصورة</div><span id="file-name">لم يتم اختيار ملف</span><img id="screenshot-preview" src="#" alt="Preview"></div>
    <input type="file" id="screenshot" name="screenshot" accept="image/*" style="display:none;" required>

    <button type="submit" class="submit-btn" id="submitBtn">🚀 تأكيد الطلب</button>
    <div id="response-msg"></div>
    
    <a href="https://t.me/CapitanoUserBot" target="_blank" class="bot-link-btn">🤖 أو اطلب عبر البوت (بديل الموقع)</a>
  </form>
</div>

<script>
  // ======== بيانات الألعاب مع الألوان والأيقونات ========
  const GAMES = {
    'PUBG': { 
      icon: '🪂', color: '#f59e0b', rgb: '245, 158, 11',
      packs: [{ label: '60 UC', price: 55 }, { label: '300+25 UC', price: 245 }, { label: '600+60 UC', price: 485 }, { label: '1500+300 UC', price: 1210 }],
      placeholder: 'أدخل ID حسابك في PUBG'
    },
    'FC Mobile': { 
      icon: '⚽', color: '#3b82f6', rgb: '59, 130, 246',
      packs: [{ label: '40+8 Points', price: 30 }, { label: '100+20 Points', price: 70 }, { label: '520+104 Points', price: 270 }, { label: '1070+214 Points', price: 520 }],
      placeholder: 'أدخل ID حسابك في FC'
    },
    'Call of Duty': { 
      icon: '🔫', color: '#10b981', rgb: '16, 185, 129',
      packs: [{ label: '30 CP', price: 30 }, { label: '80 CP', price: 55 }, { label: '420 CP', price: 260 }, { label: '880 CP', price: 510 }],
      placeholder: 'أدخل ID حسابك في COD'
    },
    'Blood Strike MAX': { 
      icon: '🧛', color: '#ef4444', rgb: '239, 68, 68',
      packs: [{ label: '50+1 Golds', price: 30 }, { label: '100+5 Golds', price: 55 }, { label: '300+20 Golds', price: 150 }, { label: '500+40 Golds', price: 240 }, { label: '1000+100 Golds', price: 470 }],
      placeholder: 'أدخل ID حسابك في Blood Strike'
    },
    'Free Fire': { 
      icon: '🔥', color: '#f97316', rgb: '249, 115, 22',
      packs: [{ label: '100 D', price: 65 }, { label: '210 D', price: 120 }, { label: '530 D', price: 280 }, { label: '1080 D', price: 555 }],
      placeholder: 'أدخل ID حسابك في Free Fire'
    },
    'Telegram Stars': { 
      icon: '⭐', color: '#8b5cf6', rgb: '139, 92, 246',
      packs: [{ label: '75 Stars', price: 80 }, { label: '100 Stars', price: 115 }, { label: '150 Stars', price: 155 }, { label: '250 Stars', price: 250 }, { label: '350 Stars', price: 335 }, { label: '500 Stars', price: 470 }, { label: '750 Stars', price: 700 }, { label: 'Premium 3 Months', price: 745 }],
      placeholder: '@username أو اليوزرنيم'
    }
  };

  const gameTabs = document.getElementById('gameTabs');
  const panelsContainer = document.getElementById('panelsContainer');
  let currentGame = 'PUBG';
  let selectedPack = null;

  // بناء التابز والبانيلز
  Object.keys(GAMES).forEach((key, index) => {
    const game = GAMES[key];
    // Tab
    const btn = document.createElement('div');
    btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
    btn.dataset.game = key;
    btn.innerHTML = `<span class="icon">${game.icon}</span> ${key}`;
    btn.addEventListener('click', () => selectGame(key));
    gameTabs.appendChild(btn);

    // Panel
    const panel = document.createElement('div');
    panel.className = `game-panel ${index === 0 ? 'active' : ''}`;
    panel.id = `panel-${key}`;
    
    let packsHTML = '';
    game.packs.forEach((p, i) => {
      packsHTML += `<div class="pack-card" data-pack="${p.label}" data-price="${p.price}" onclick="selectPack(this, '${key}')">
        ${p.label} <span class="price-tag">${p.price} ج.م</span>
      </div>`;
    });

    panel.innerHTML = `
      <div class="panel-title"><span>${game.icon}</span> ${key}</div>
      <div class="packs-grid">${packsHTML}</div>
      <div class="form-group">
        <label>🆔 الـ ID / اليوزرنيم</label>
        <input type="text" class="account-input" data-game="${key}" placeholder="${game.placeholder}" required>
      </div>
      <div class="form-group">
        <label>📝 ملاحظات إضافية (اختياري)</label>
        <textarea class="notes-input" data-game="${key}" placeholder="أي تفاصيل تريد إضافتها..."></textarea>
      </div>
      <input type="hidden" class="game-name" value="${key}">
    `;
    panelsContainer.appendChild(panel);
  });

  // دوال التحكم
  function selectGame(key) {
    currentGame = key;
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.querySelector(`.tab-btn[data-game="${key}"]`).classList.add('active');
    document.querySelectorAll('.game-panel').forEach(el => el.classList.remove('active'));
    document.getElementById(`panel-${key}`).classList.add('active');
    
    // تغيير لون الموقع
    const color = GAMES[key].color;
    const rgb = GAMES[key].rgb;
    document.documentElement.style.setProperty('--accent', color);
    document.documentElement.style.setProperty('--accent-rgb', rgb);
    document.getElementById('appContainer').style.borderColor = `rgba(${rgb}, 0.3)`;
    
    // إعادة تعيين الاختيارات
    selectedPack = null;
    document.querySelectorAll('.pack-card').forEach(el => el.classList.remove('active'));
    document.querySelector(`#panel-${key} .account-input`).value = '';
    document.querySelector(`#panel-${key} .notes-input`).value = '';
  }

  function selectPack(el, gameKey) {
    document.querySelectorAll(`#panel-${gameKey} .pack-card`).forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    selectedPack = { label: el.dataset.pack, price: el.dataset.price };
  }

  // رفع الصورة
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('screenshot');
  const fileName = document.getElementById('file-name');
  const preview = document.getElementById('screenshot-preview');

  uploadArea.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', function() {
    const file = this.files[0];
    if (file) {
      fileName.textContent = file.name;
      const reader = new FileReader();
      reader.onload = (e) => { preview.src = e.target.result; preview.style.display = 'block'; };
      reader.readAsDataURL(file);
    }
  });

  // إرسال النموذج
  const form = document.getElementById('orderForm');
  const submitBtn = document.getElementById('submitBtn');
  const responseMsg = document.getElementById('response-msg');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const activePanel = document.querySelector('.game-panel.active');
    const game = activePanel.querySelector('.game-name').value;
    const accountId = activePanel.querySelector('.account-input').value.trim();
    const notes = activePanel.querySelector('.notes-input').value.trim();

    if (!selectedPack) { alert('اختر باقة!'); return; }
    if (!accountId) { alert('اكتب الـ ID!'); return; }
    if (!fileInput.files || fileInput.files.length === 0) {
      responseMsg.style.display = 'block';
      responseMsg.style.background = 'rgba(239,68,68,0.2)';
      responseMsg.style.color = '#fca5a5';
      responseMsg.textContent = '⚠️ لازم ترفع السكرين شوت!';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري الإرسال...';

    const formData = new FormData();
    formData.append('game', game);
    formData.append('pack', selectedPack.label);
    formData.append('price', selectedPack.price);
    formData.append('account_id', accountId);
    formData.append('notes', notes);
    formData.append('screenshot', fileInput.files[0]);

    try {
      const res = await fetch('/api/submit', { method: 'POST', body: formData });
      const data = await res.json();
      responseMsg.style.display = 'block';
      if (data.success) {
        responseMsg.style.background = 'rgba(34,197,94,0.15)';
        responseMsg.style.color = '#86efac';
        responseMsg.textContent = '✅ ' + data.message;
        form.reset();
        selectedPack = null;
        document.querySelectorAll('.pack-card').forEach(el => el.classList.remove('active'));
        preview.style.display = 'none';
        fileName.textContent = 'لم يتم اختيار ملف';
        document.querySelector('.active .account-input').value = '';
        document.querySelector('.active .notes-input').value = '';
      } else {
        responseMsg.style.background = 'rgba(239,68,68,0.2)';
        responseMsg.style.color = '#fca5a5';
        responseMsg.textContent = '❌ ' + data.message;
      }
    } catch (err) {
      responseMsg.style.display = 'block';
      responseMsg.style.background = 'rgba(239,68,68,0.2)';
      responseMsg.style.color = '#fca5a5';
      responseMsg.textContent = '❌ حدث خطأ في الشبكة.';
    }
    submitBtn.disabled = false;
    submitBtn.textContent = '🚀 تأكيد الطلب';
  });

  // تفعيل أول لعبة
  selectGame('PUBG');
</script>
</body>
    </html>
