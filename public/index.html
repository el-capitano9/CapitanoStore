<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capitano Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      min-height: 100vh;
      background: #0a0e1a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 750px;
      width: 100%;
      background: rgba(255,255,255,0.03);
      border-radius: 40px;
      padding: 30px 25px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #fbbf24, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p { color: #94a3b8; }
    .game-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
    }
    .game-card {
      background: rgba(30,41,59,0.4);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      color: white;
      text-decoration: none;
      display: block;
    }
    .game-card:hover { transform: scale(1.03); border-color: #fbbf24; }
    .game-card img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 8px; }
    .game-card span { display: block; font-weight: 700; font-size: 1rem; }

    /* صفحة اللعبة المنفصلة */
    .game-page {
      display: none;
      animation: fade 0.4s ease;
    }
    .game-page.active { display: block; }
    @keyframes fade { 0% { opacity:0; transform:translateY(20px); } 100% { opacity:1; transform:translateY(0); } }
    .back-btn {
      background: #1e293b;
      border: none;
      color: white;
      padding: 12px 25px;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 20px;
      border: 1px solid #334155;
      transition: 0.3s;
    }
    .back-btn:hover { background: #2d3748; }
    .game-title {
      color: white;
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .game-title img { width: 50px; height: 50px; }
    .packs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }
    .pack-btn {
      background: rgba(15,23,42,0.6);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      color: #e2e8f0;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
    }
    .pack-btn:hover { border-color: #fbbf24; }
    .pack-btn.active { border-color: #fbbf24; background: rgba(251,191,36,0.1); }
    .pack-btn .price { display: block; font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }

    .form-group { margin: 18px 0; }
    .form-group label { color: #e2e8f0; font-weight: 600; display: block; margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid #334155;
      border-radius: 14px;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: #fbbf24; }
    .form-group textarea { min-height: 60px; resize: vertical; }

    .warning {
      background: rgba(239,68,68,0.08);
      border-right: 4px solid #ef4444;
      padding: 12px;
      border-radius: 12px;
      color: #fca5a5;
      margin: 15px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bank {
      background: rgba(251,191,36,0.05);
      border: 1px solid #fbbf24;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      margin: 15px 0;
      color: #fcd34d;
    }
    .bank small { color: #d97706; display: block; }

    .upload-area {
      border: 2px dashed #475569;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      color: #94a3b8;
      cursor: pointer;
      margin: 15px 0;
      transition: 0.3s;
    }
    .upload-area:hover { border-color: #fbbf24; }
    #file-name { color: #fbbf24; font-weight: 600; }
    #screenshot-preview { max-width: 100%; max-height: 200px; margin-top: 12px; border-radius: 12px; display: none; }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: #fbbf24;
      border: none;
      border-radius: 20px;
      font-size: 1.3rem;
      font-weight: 800;
      color: #0a0e1a;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }
    .submit-btn:hover { transform: scale(1.02); filter: brightness(1.1); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    #response-msg { margin-top: 20px; text-align: center; font-weight: 600; padding: 12px; border-radius: 14px; display: none; }

    .bot-link {
      display: block;
      margin-top: 20px;
      background: #1e293b;
      padding: 14px;
      border-radius: 40px;
      text-align: center;
      color: #94a3b8;
      text-decoration: none;
      border: 1px solid #334155;
      transition: 0.3s;
    }
    .bot-link:hover { background: #2d3748; color: white; }

    @media (max-width: 500px) { .game-list { grid-template-columns: 1fr 1fr; } .packs-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
<div class="container" id="app">

  <!-- الصفحة الرئيسية -->
  <div id="homePage">
    <div class="header">
      <h1>🏴‍☠️ CAPITANO</h1>
      <p>متجر الشحن الأسرع</p>
    </div>
    <div class="game-list" id="gameList"></div>
    <a href="https://t.me/CapitanoUserBot" target="_blank" class="bot-link">🤖 تواصل عبر البوت</a>
  </div>

  <!-- صفحات الألعاب (ستظهر مخفية) -->
  <div id="gamePages"></div>
</div>

<script>
  // ======== بيانات الألعاب (مع صور) ========
  const GAMES = {
    'PUBG': {
      icon: 'https://img.icons8.com/color/48/pubg.png',
      packs: [
        { label: '60 UC', price: 60 },
        { label: '300+25 UC', price: 245 },
        { label: '600+60 UC', price: 485 },
        { label: '1500+300 UC', price: 1210 }
      ],
      placeholder: 'أدخل ID حسابك في PUBG'
    },
    'FC Mobile': {
      icon: 'https://img.icons8.com/color/48/fc-mobile.png',
      packs: [
        { label: '40+8 Points', price: 30 },
        { label: '100+20 Points', price: 70 },
        { label: '520+104 Points', price: 270 },
        { label: '1070+214 Points', price: 520 }
      ],
      placeholder: 'أدخل ID حسابك في FC'
    },
    'Call of Duty': {
      icon: 'https://img.icons8.com/color/48/call-of-duty.png',
      packs: [
        { label: '30 CP', price: 30 },
        { label: '80 CP', price: 55 },
        { label: '420 CP', price: 260 },
        { label: '880 CP', price: 510 }
      ],
      placeholder: 'أدخل ID حسابك في COD'
    },
    'Blood Strike MAX': {
      icon: 'https://img.icons8.com/color/48/blood-strike.png',
      packs: [
        { label: '50+1 Golds', price: 30 },
        { label: '100+5 Golds', price: 55 },
        { label: '300+20 Golds', price: 150 },
        { label: '500+40 Golds', price: 240 },
        { label: '1000+100 Golds', price: 470 }
      ],
      placeholder: 'أدخل ID حسابك في Blood Strike'
    },
    'Free Fire': {
      icon: 'https://img.icons8.com/color/48/free-fire.png',
      packs: [
        { label: '100 D', price: 65 },
        { label: '210 D', price: 120 },
        { label: '530 D', price: 280 },
        { label: '1080 D', price: 555 }
      ],
      placeholder: 'أدخل ID حسابك في Free Fire'
    },
    'Telegram Stars': {
      icon: 'https://img.icons8.com/color/48/telegram-app.png',
      packs: [
        { label: '75 Stars', price: 80 },
        { label: '100 Stars', price: 115 },
        { label: '150 Stars', price: 155 },
        { label: '250 Stars', price: 250 },
        { label: '350 Stars', price: 335 },
        { label: '500 Stars', price: 470 },
        { label: '750 Stars', price: 700 },
        { label: 'Premium 3 Months', price: 745 }
      ],
      placeholder: '@username الخاص بك'
    }
  };

  const homePage = document.getElementById('homePage');
  const gamePages = document.getElementById('gamePages');
  const gameList = document.getElementById('gameList');

  // بناء الصفحة الرئيسية
  Object.keys(GAMES).forEach(key => {
    const game = GAMES[key];
    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `<img src="${game.icon}" alt="${key}" onerror="this.style.display='none'"><span>${key}</span>`;
    card.addEventListener('click', () => openGame(key));
    gameList.appendChild(card);
  });

  // بناء صفحات الألعاب
  Object.keys(GAMES).forEach(key => {
    const game = GAMES[key];
    const page = document.createElement('div');
    page.className = 'game-page';
    page.id = `page-${key}`;

    let packsHTML = '';
    game.packs.forEach((p, i) => {
      packsHTML += `<div class="pack-btn" data-pack="${p.label}" data-price="${p.price}">${p.label} <span class="price">${p.price} ج.م</span></div>`;
    });

    page.innerHTML = `
      <button class="back-btn" onclick="goHome()">🔙 رجوع</button>
      <div class="game-title"><img src="${game.icon}" alt="${key}"> ${key}</div>
      <div class="packs-grid">${packsHTML}</div>
      <div class="form-group">
        <label>🆔 الـ ID / اليوزرنيم</label>
        <input type="text" id="account-${key}" placeholder="${game.placeholder}" required>
      </div>
      <div class="form-group">
        <label>📝 ملاحظات (اختياري)</label>
        <textarea id="notes-${key}" placeholder="أي تفاصيل إضافية..."></textarea>
      </div>
      <div class="warning"><span>⚠️</span> <div><strong>تحذير:</strong> ارفع الصورة قبل التأكيد، وتأكد من ظهور المبلغ والرقم.</div></div>
      <div class="bank"><p>💳 حول المبلغ على رقم: <strong style="color:#fde047;">01036732010</strong></p><small>فودافون كاش</small></div>
      <div class="upload-area" id="upload-${key}"><div>📤 اضغط لرفع الصورة</div><span id="file-name-${key}">لم يتم اختيار ملف</span><img id="preview-${key}" src="#" alt="Preview" style="display:none; max-width:100%; margin-top:10px; border-radius:12px;"></div>
      <input type="file" id="screenshot-${key}" accept="image/*" style="display:none;">
      <button class="submit-btn" id="submit-${key}">🚀 تأكيد الطلب</button>
      <div id="response-${key}" style="margin-top:15px; text-align:center; font-weight:600; display:none;"></div>
      <a href="https://t.me/CapitanoUserBot" target="_blank" class="bot-link" style="margin-top:20px;">🤖 أو اطلب عبر البوت</a>
    `;
    gamePages.appendChild(page);

    // ربط رفع الصورة
    const uploadArea = page.querySelector(`#upload-${key}`);
    const fileInput = page.querySelector(`#screenshot-${key}`);
    const fileName = page.querySelector(`#file-name-${key}`);
    const preview = page.querySelector(`#preview-${key}`);
    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', function() {
      if (this.files[0]) {
        fileName.textContent = this.files[0].name;
        const reader = new FileReader();
        reader.onload = (e) => { preview.src = e.target.result; preview.style.display = 'block'; };
        reader.readAsDataURL(this.files[0]);
      }
    });

    // ربط زر الإرسال
    const submitBtn = page.querySelector(`#submit-${key}`);
    const responseDiv = page.querySelector(`#response-${key}`);
    submitBtn.addEventListener('click', async function(e) {
      e.preventDefault();
      const packBtn = page.querySelector('.pack-btn.active');
      const account = page.querySelector(`#account-${key}`).value.trim();
      const notes = page.querySelector(`#notes-${key}`).value.trim();
      const file = fileInput.files[0];

      if (!packBtn) { responseDiv.style.display = 'block'; responseDiv.style.color = '#fca5a5'; responseDiv.textContent = '⚠️ اختر باقة!'; return; }
      if (!account) { responseDiv.style.display = 'block'; responseDiv.style.color = '#fca5a5'; responseDiv.textContent = '⚠️ اكتب الـ ID!'; return; }
      if (!file) { responseDiv.style.display = 'block'; responseDiv.style.color = '#fca5a5'; responseDiv.textContent = '⚠️ ارفع الصورة!'; return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الإرسال...';

      const formData = new FormData();
      formData.append('game', key);
      formData.append('pack', packBtn.dataset.pack);
      formData.append('price', packBtn.dataset.price);
      formData.append('account_id', account);
      formData.append('notes', notes);
      formData.append('screenshot', file);

      try {
        const res = await fetch('/api/submit', { method: 'POST', body: formData });
        const data = await res.json();
        responseDiv.style.display = 'block';
        if (data.success) {
          responseDiv.style.color = '#86efac';
          responseDiv.textContent = '✅ ' + data.message;
          // إعادة تعيين
          page.querySelectorAll('.pack-btn').forEach(el => el.classList.remove('active'));
          page.querySelector(`#account-${key}`).value = '';
          page.querySelector(`#notes-${key}`).value = '';
          fileInput.value = '';
          preview.style.display = 'none';
          fileName.textContent = 'لم يتم اختيار ملف';
        } else {
          responseDiv.style.color = '#fca5a5';
          responseDiv.textContent = '❌ ' + data.message;
        }
      } catch (err) {
        responseDiv.style.display = 'block';
        responseDiv.style.color = '#fca5a5';
        responseDiv.textContent = '❌ خطأ في الشبكة، حاول تاني.';
      }
      submitBtn.disabled = false;
      submitBtn.textContent = '🚀 تأكيد الطلب';
    });

    // اختيار الباقة (لكل صفحة)
    page.querySelectorAll('.pack-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        page.querySelectorAll('.pack-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      });
    });
  });

  function openGame(key) {
    homePage.style.display = 'none';
    document.querySelectorAll('.game-page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${key}`).classList.add('active');
  }

  function goHome() {
    homePage.style.display = 'block';
    document.querySelectorAll('.game-page').forEach(p => p.classList.remove('active'));
  }
</script>
</body>
</html>
